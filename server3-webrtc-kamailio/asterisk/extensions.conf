;=========================================================
; Asterisk 23.5.0 - VPL WebRTC Dialplan
; WebRTC Server: 192.168.88.47
; Destination SIP Server: 192.168.88.88:5060
; Core SIP Switch: 192.168.88.51
; Central Portal: 192.168.88.119
;=========================================================

[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]
OUTBOUND_TRUNK=VPL-OUTBOUND

;=========================================================
; WEBRTC INBOUND CALLS
; Forward all numeric dialed numbers to 192.168.88.88
;=========================================================

[from-webrtc]
; WebRTC Echo Test for Softphone Verification
exten => *43,1,NoOp(=== WebRTC Softphone Echo Test for ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,Playback(demo-echotest)
 same => n,Echo()
 same => n,Playback(demo-echodone)
 same => n,Hangup()

; Voicemail Main
exten => *97,1,NoOp(=== Voicemail Access for ${CALLERID(num)} ===)
 same => n,Answer()
 same => n,VoiceMailMain(${CALLERID(num)}@default)
 same => n,Hangup()

; Internal Extension to Extension (2000-2999, 1000-1999)
exten => _[1-9]XXX,1,NoOp(=== WebRTC Internal Call: ${CALLERID(num)} -> ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@kamailio-edge,25)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,NoOp(Internal Ext ${EXTEN} status: ${DIALSTATUS} -> Voicemail)
 same => n,Goto(from-vpl,${EXTEN},1)
 same => n(done),Hangup()

; PSTN / External Outbound via VPL-OUTBOUND
exten => _+X.,1,NoOp(=== WebRTC Outbound Call (+): Target=${EXTEN} Caller=${CALLERID(num)} ===)
 same => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},60)
 same => n,Hangup()

exten => _00.,1,NoOp(=== WebRTC Outbound Call (00): Target=${EXTEN} Caller=${CALLERID(num)} ===)
 same => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},60)
 same => n,Hangup()

exten => _X.,1,NoOp(=== WebRTC Outbound Call (Numeric): Target=${EXTEN} Caller=${CALLERID(num)} ===)
 same => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},60)
 same => n,Hangup()

exten => _X!,1,NoOp(=== WebRTC Outbound Call (Wildcard): Target=${EXTEN} Caller=${CALLERID(num)} ===)
 same => n,Dial(PJSIP/${EXTEN}@${OUTBOUND_TRUNK},60)
 same => n,Hangup()

;=========================================================
; VOICEMAIL UPLOAD SUBROUTINE (GUARANTEED ON HANGUP)
;=========================================================

[sub-upload-voicemail]
exten => s,1,NoOp(=== [Voicemail Upload Handler] Checking file: ${VM_FILE}.wav for Target: ${VM_TARGET} Caller: ${CALLERID(num)} ===)
 same => n,GotoIf($["${VM_FILE}" = ""]?end)
 same => n,GotoIf($[${STAT(e,${VM_FILE}.wav)} = 0]?end)
 ; Ensure audio file has real recorded content (> 1000 bytes)
 same => n,GotoIf($[${STAT(s,${VM_FILE}.wav)} < 1000]?cleanup)
 same => n,NoOp(=== [Voicemail Upload Handler] Posting ${VM_FILE}.wav to Portal ===)
 same => n,System(curl -s -F "file=@${VM_FILE}.wav" -F "caller_id=${CALLERID(num)}" -F "did_number=${VM_TARGET}" http://192.168.88.119/api/voicemails/upload)
 same => n(cleanup),System(rm -f ${VM_FILE}.wav)
 same => n,Set(VM_FILE=)
 same => n(end),Return()

;=========================================================
; INCOMING CALLS FROM 192.168.88.51 (CORE SIP SERVER)
;=========================================================

[from-vpl]
; Handle standard extension numbers (2001, 2005, 2013, etc.)
exten => _[0-9].,1,NoOp(=== Incoming Call for WebRTC Ext: ${EXTEN} (Caller: ${CALLERID(num)}) ===)
 same => n,NoOp(Forwarding to Kamailio via kamailio-edge)
 ; Step 1: Ring WebRTC softphone for 20 seconds
 same => n,Dial(PJSIP/${EXTEN}@kamailio-edge,20)
 ; Step 2: If answered, proceed to done
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 ; Step 3: Destination unavailable / no-answer -> start Voicemail
 same => n,NoOp(=== Destination Unavailable: ${DIALSTATUS} - Starting Voicemail ===)
 same => n,Answer()
 same => n,Wait(1)
 ; Attach hangup handler so if caller hangs up at any point, recording is uploaded!
 same => n,Set(VM_TARGET=${EXTEN})
 same => n,Set(VM_FILE=/tmp/vm-${EXTEN}-${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-upload-voicemail,s,1)
 ; Step 4: Play greeting prompt
 same => n,Playback(vm-intro)
 ; Step 5: Record caller audio (up to 120s, stops on silence, #, or caller hangup)
 same => n,Record(${VM_FILE}.wav,3,120,k)
 ; Step 6: Thank you prompt (if caller didn't hang up)
 same => n,Playback(auth-thankyou)
 ; Step 7: Upload recording
 same => n,Gosub(sub-upload-voicemail,s,1)
 same => n(done),Hangup()

; Handle E.164 numbers with plus (+61298765432, etc.)
exten => _+X.,1,NoOp(=== Incoming Call for DID (+): ${EXTEN} ===)
 same => n,Dial(PJSIP/${EXTEN}@kamailio-edge,20)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(VM_TARGET=${EXTEN})
 same => n,Set(VM_FILE=/tmp/vm-${EXTEN}-${EPOCH})
 same => n,Set(CHANNEL(hangup_handler_push)=sub-upload-voicemail,s,1)
 same => n,Playback(vm-intro)
 same => n,Record(${VM_FILE}.wav,3,120,k)
 same => n,Playback(auth-thankyou)
 same => n,Gosub(sub-upload-voicemail,s,1)
 same => n(done),Hangup()

exten => h,1,NoOp(=== from-vpl Hangup ===)
 same => n,GosubIf($["${VM_FILE}" != ""]?sub-upload-voicemail,s,1)

; Fallback if unmatched
exten => _X!,1,NoOp(Incoming SIP Call from VPL - Unmatched)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,NoOp(Destination: ${EXTEN})
 same => n,Hangup(21)

;=========================================================
; INBOUND FROM 192.168.88.51 -> VPL OUTBOUND
;=========================================================

[from-51]
exten => _X!,1,NoOp(=== Incoming Call from 192.168.88.51 ===)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,NoOp(Destination: ${EXTEN})
 same => n,NoOp(Forwarding to 192.168.88.88 via VPL-OUTBOUND)
 same => n,Dial(PJSIP/${EXTEN}@VPL-OUTBOUND,60)
 same => n,NoOp(Call Status: ${DIALSTATUS})
 same => n,Hangup()

[from-kamailio]
exten => _X!,1,NoOp(=== Incoming SIP from Kamailio ===)
 same => n,NoOp(Caller: ${CALLERID(num)})
 same => n,NoOp(Destination: ${EXTEN})
 same => n,Hangup(21)

;=========================================================
; END OF CONFIGURATION
;=========================================================
