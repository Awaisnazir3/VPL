;=========================================================
; SipMyNumber - Asterisk 23.5.0 PJSIP Configuration
; Server: 192.168.88.47
; Kamailio Edge Proxy: UDP 5060
; Asterisk Media Server: UDP 5062
; Core SIP Server: 192.168.88.51:5060
;=========================================================

;=========================================================
; GLOBAL SETTINGS
;=========================================================

[global]
type=global
user_agent=SipMyNumber-MediaServer
endpoint_identifier_order=ip,username,anonymous


;=========================================================
; SIP UDP TRANSPORT
;=========================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5062


;=========================================================
; WSS TRANSPORT
;=========================================================

[transport-wss]
type=transport
protocol=wss
bind=127.0.0.1:18089


;=========================================================
; WEBRTC ENDPOINT TEMPLATE
;=========================================================

[webrtc-profile](!)
type=endpoint
transport=transport-udp
context=from-webrtc
disallow=all
allow=opus,ulaw,alaw
webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=no
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
dtls_setup=actpass
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes


;=========================================================
; WEBRTC EXTENSION 2001
;=========================================================

[2001](webrtc-profile)
auth=auth-2001
aors=2001


[auth-2001]
type=auth
auth_type=userpass
username=2001
password=VplTestPassword2026!


[2001]
type=aor
max_contacts=5
remove_existing=yes


;=========================================================
; KAMAILIO EDGE PROXY
; Kamailio -> Asterisk
;=========================================================

[kamailio-edge]
type=endpoint
transport=transport-udp
context=from-webrtc
;context=from-kamailio
disallow=all
allow=opus,ulaw,alaw

webrtc=yes
use_avpf=yes
media_encryption=dtls
dtls_verify=fingerprint
dtls_setup=actpass
dtls_cert_file=/etc/asterisk/keys/asterisk.crt
dtls_private_key=/etc/asterisk/keys/asterisk.key
ice_support=yes
media_use_received_transport=yes
rtcp_mux=yes
rewrite_contact=yes
aors=kamailio-edge
direct_media=no
rtp_symmetric=yes
force_rport=yes


[kamailio-edge]
type=aor
contact=sip:127.0.0.1:5060


[kamailio-edge-identify]
type=identify
endpoint=kamailio-edge
match=127.0.0.1, 192.168.88.47


;=========================================================
; CORE SIP SERVER 192.168.88.51
;=========================================================

[VPL-OUTBOUND]
type=endpoint
transport=transport-udp
context=from-vpl

disallow=all
allow=ulaw,alaw

aors=VPL-OUTBOUND

direct_media=no
rtp_symmetric=yes
force_rport=yes


[VPL-OUTBOUND]
type=aor
contact=sip:192.168.88.51:5060


[VPL-OUTBOUND-identify]
type=identify
endpoint=VPL-OUTBOUND
match=192.168.88.51


;=========================================================
; END OF PJSIP CONFIGURATION
;=========================================================
; Provisioned User for Order ID 2005
[2005](webrtc-profile)
auth=auth-2005
aors=2005

[auth-2005]
type=auth
auth_type=userpass
username=2005
password=12345

[2005]
type=aor
max_contacts=5
remove_existing=yes
default_expiration=60
minimum_expiration=30
maximum_expiration=120
