modparam("nathelper", "sipping_from", "sip:pinger@192.168.88.47")
modparam("nathelper", "received_avp", "$avp(s:rcv)")

####### Routing Logic ########

event_route[xhttp:request] {
    set_reply_close();
    set_reply_no_connect();

    if ($Rp != 8089) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }

    if ($hdr(Upgrade) =~ "[wW]ebsocket" && $hdr(Connection) =~ "[uU]pgrade" && $rm == "GET") {
        if (ws_handle_handshake()) {
            exit;
        }
    }

    xhttp_reply("404", "Not Found", "", "");
    exit;
}

event_route[websocket:closed] {
    xlog("L_INFO", "WebSocket connection closed\n");
}

request_route {
    # Per-request sanity checks
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }

    if (!sanity_check(1511, 7)) {
        xlog("L_ERR", "Malformed SIP message\n");
        exit;
    }

    # Handle OPTIONS keepalive
    if (is_method("OPTIONS") && uri == myself) {
        sl_send_reply(200, "Keepalive OK");
        exit;
    }

    # Handle CANCEL
    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            route(RELAY);
        }
        exit;
    }

    # Sequential requests (within dialog)
    if (has_totag()) {
        if (loose_route()) {
            handle_ruri_alias();
            route(RELAY);
            exit;
        }
        if (is_method("ACK")) {
            handle_ruri_alias();
            if (t_check_trans()) {
                route(RELAY);
                exit;
            }
            route(RELAY);
            exit;
        }
        sl_send_reply(404, "Not Found");
        exit;
    }

    # Retransmissions
    t_check_trans();

    # Handle REGISTER
    if (is_method("REGISTER")) {
        route(AUTH_REGISTER);
        exit;
    }

    # Record-Route for dialog-forming requests
    if (is_method("INVITE|SUBSCRIBE")) {
        record_route();
    }

    # Handle INVITE
    if (is_method("INVITE")) {
        route(HANDLE_INVITE);
        exit;
    }

    route(RELAY);
}

route[AUTH_REGISTER] {
    if (!auth_check("$fd", "subscriber", "1")) {
        auth_challenge("$fd", "0");
        exit;
    }

    # Fix contact for WebRTC NAT traversal
    fix_nated_register();
    set_contact_alias();

    if (!save("location")) {
        sl_reply_error();
        exit;
    }
    xlog("L_INFO", "WebRTC user $fU registered successfully\n");
    exit;
}

route[HANDLE_INVITE] {
    # Check if incoming call is from Asterisk (Media Server or Core SIP)
    if ($si == "127.0.0.1" || $si == "192.168.88.47" || $si == "192.168.88.51") {
        xlog("L_INFO", "Incoming call from Asterisk for extension $rU\n");
        if (!lookup("location")) {
            xlog("L_WARN", "Extension $rU not found in Kamailio location table\n");
            sl_send_reply(404, "Extension Not Registered");
            exit;
        }
        handle_ruri_alias();
        t_on_reply("MANAGE_REPLY");
        route(RELAY);
        exit;
    }

    # Call is from WebRTC client: authenticate
    if (!auth_check("$fd", "subscriber", "1")) {
        auth_challenge("$fd", "0");
        exit;
    }

    # Forward to Asterisk media server on port 5062
    xlog("L_INFO", "WebRTC call from $fU to $rU -> Forwarding to Asterisk 127.0.0.1:5062\n");
    $du = "sip:127.0.0.1:5062";
    t_on_reply("MANAGE_REPLY");
    route(RELAY);
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route[MANAGE_REPLY] {
    add_contact_alias();
}
