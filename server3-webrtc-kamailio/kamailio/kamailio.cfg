#!KAMAILIO
#
# SipMyNumber WebRTC SIP Edge Proxy Configuration
# Kamailio 6.1 with WebSocket, TLS, and MySQL Authentication
# Server: 192.168.88.47
#

#!define WITH_MYSQL
#!define WITH_AUTH
#!define WITH_USRLOCDB

####### Global Parameters #########
debug=2
log_stderror=no
log_facility=LOG_LOCAL0

children=4

# Listeners
listen=tls:192.168.88.47:8089
listen=udp:127.0.0.1:5060
listen=udp:192.168.88.47:5060

# Alias and Domain Definitions
alias="192.168.88.47"
alias="192.168.88.51"
alias="192.168.88.47:8089"
alias="192.168.88.47:5060"
alias="127.0.0.1:5060"

# TCP and TLS parameters
tcp_connection_lifetime=3605
tcp_accept_no_cl=yes
tcp_rd_buf_size=16384
enable_tls=yes

####### Modules Section ########
loadpath "/usr/lib64/kamailio/modules/"

