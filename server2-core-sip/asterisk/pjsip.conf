; ============================================================================
; SipMyNumber — Asterisk 22 PJSIP Configuration
; Server: 192.168.88.51 (Core SIP Switch)
; ============================================================================

[global]
type=global
endpoint_identifier_order=ip,username,anonymous

; UDP Transport on port 5060
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; Anonymous Endpoint (All incoming unauthenticated SIP calls)
[anonymous]
type=endpoint
context=public-incoming
disallow=all
allow=ulaw,alaw,g722,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; ======================================================
; KAMAILIO WEBRTC EDGE PROXY (192.168.88.47)
; ======================================================
[kamailio-edge]
type=endpoint
transport=transport-udp
context=from-47-direct
disallow=all
allow=ulaw,alaw,g722,opus
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
aors=kamailio-edge-aor

[kamailio-edge-aor]
type=aor
contact=sip:192.168.88.47:5060
contact=sip:192.168.88.78:5060

[kamailio-edge-identify]
type=identify
endpoint=kamailio-edge
match=192.168.88.47, 192.168.88.78

; ======================================================
; OUTBOUND CARRIER TRUNK (VPL-OUTBOUND)
; ======================================================


[VPL-OUTBOUND]
type=endpoint
transport=transport-udp
context=from-vpl
disallow=all
allow=ulaw,alaw
aors=VPL-OUTBOUND
direct_media=no

[VPL-OUTBOUND]
type=aor
contact=sip:192.168.88.88:5060

[VPL-OUTBOUND]
type=identify
endpoint=VPL-OUTBOUND
match=192.168.88.88






